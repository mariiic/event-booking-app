security:
  jwt:
    access:
      expiration:
        minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
      secret: ${JWT_ACCESS_SECRET}
    refresh:
      expiration:
        days: ${JWT_REFRESH_EXPIRATION_DAYS}

spring:
  redis:
    ttl: 15

outbox:
  batch:
    size: 50
  processing:
    fixedRate: 3s
  attempts: 5