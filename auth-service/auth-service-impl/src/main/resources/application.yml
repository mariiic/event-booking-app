security:
  jwt:
    access:
      expiration:
        minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
      secret: ${JWT_ACCESS_SECRET}
    refresh:
      expiration:
        days: ${JWT_REFRESH_EXPIRATION_DAYS}

server:
  port: 8080

spring:
  redis:
    ttl: 15
  data:
    redis:
      port: ${REDIS_PORT}
      host: ${REDIS_HOST}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

#  jpa:
#    hibernate:
#      ddl-auto: update

  rabbitmq:
    host: ${RABBIT_URL}
    port: 5672
    username: guest
    password: guest

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml
    enabled: true

outbox:
  batch:
    size: 50
  processing:
    fixedRate: 3s
  attempts: 5