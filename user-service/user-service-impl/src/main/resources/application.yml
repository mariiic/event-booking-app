server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  liquibase:
    change-log: classpath:db/changelog/changelog-master.yaml